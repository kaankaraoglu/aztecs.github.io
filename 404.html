<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aztecs</title>
    <meta name="description" content="Aztecs Guild" />
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Cal Sans',
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #111;
        color: #eee;
        text-align: center;
      }
      #app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .big-404 {
        font-size: clamp(4rem, 18vw, 14rem);
        font-weight: 800;
        line-height: 0.85;
        letter-spacing: -4px;
        color: #fff;
        margin: 0 0 1rem;
      }
      .big-404-sub {
        font-size: 1.25rem;
        max-width: 40ch;
        margin: 0 auto 1.5rem;
        opacity: 0.85;
      }
      .home-link {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.75rem 1.25rem;
        border: 1px solid #ffa20355;
        color: #ffa203;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: 0.25s;
      }
      .home-link:hover {
        background: #ffa20315;
        border-color: #ffa203;
      }
      @media (max-width: 600px) {
        .big-404 {
          letter-spacing: -2px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="big-404">404</div>
      <p class="big-404-sub">
        Page not found. If this doesn’t redirect automatically, use the button below.
      </p>
      <a class="home-link" href="/">Go to Home</a>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
