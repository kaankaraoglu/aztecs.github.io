name: Fetch Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch & commit data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch all data
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: npm run fetch-data

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/wcl-progression.json src/data/wcl-stats.json src/data/rio-mythicplus.json
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore: update fetched data"
          git push
