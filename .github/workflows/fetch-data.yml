name: Fetch Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: fetch-data
  cancel-in-progress: false

# The checkout and the push both use secrets.PAT_TOKEN, so GITHUB_TOKEN needs
# nothing.
permissions:
  contents: read

jobs:
  fetch:
    name: Fetch & commit data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Run each fetcher as its own step so one upstream outage does not cancel
      # the other two, and so a failure is attributable in the run log.
      - name: Fetch raid progression
        id: wcl
        continue-on-error: true
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: node scripts/fetch-wcl-data.js

      - name: Fetch Mythic+ data
        id: rio
        continue-on-error: true
        run: node scripts/fetch-rio-data.js

      - name: Fetch raid stats
        id: stats
        continue-on-error: true
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: node scripts/fetch-wcl-stats.js

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/wcl-progression.json src/data/wcl-stats.json src/data/rio-mythicplus.json
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore: update fetched data"
          # main may have moved during the fetch; rebase rather than losing the run.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Fail if any fetch failed
        if: steps.wcl.outcome == 'failure' || steps.rio.outcome == 'failure' || steps.stats.outcome == 'failure'
        run: |
          echo "wcl=${{ steps.wcl.outcome }} rio=${{ steps.rio.outcome }} stats=${{ steps.stats.outcome }}"
          echo "One or more data fetches failed; the site is serving the last good data." >> "$GITHUB_STEP_SUMMARY"
          exit 1
