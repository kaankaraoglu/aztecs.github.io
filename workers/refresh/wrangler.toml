name = "aztecs-refresh"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = ""        # fill in after `wrangler kv namespace create RATE_LIMIT`

# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN       — fine-grained PAT with Actions:write scope for this repo
#   TURNSTILE_SECRET   — Cloudflare Turnstile secret key
